<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Presensi SMPN 6 Singaraja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl shadow-sm border border-slate-200 p-5 space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white text-xs font-bold">SMP</div>
        <div>
          <h1 class="text-sm font-bold text-slate-800">SMPN 6 SINGARAJA</h1>
          <p class="text-[11px] text-slate-500">Presensi Asistensi Mengajar</p>
        </div>
      </div>
      <span class="text-[10px] font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full border border-slate-200" id="live-clock">
        --:-- WITA
      </span>
    </div>

    <!-- Status Card Box -->
    <div id="status-card" class="p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-2">
      <div class="flex items-center space-x-2">
        <span id="status-icon" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
        <h2 id="status-title" class="text-xs font-bold text-amber-900">Memeriksa Lokasi GPS...</h2>
      </div>
      <p id="status-desc" class="text-[11px] text-amber-700 leading-relaxed">
        Mohon izinkan akses lokasi (GPS) pada browser ponsel Anda untuk memvalidasi keberadaan di sekolah.
      </p>
    </div>

    <!-- Info Radius -->
    <div class="bg-slate-100 p-3 rounded-xl flex items-center justify-between text-xs text-slate-600">
      <span>Jarak Terdeteksi:</span>
      <span id="distance-text" class="font-bold text-slate-800">-</span>
    </div>

    <!-- CTA Button menuju Google Form -->
    <a id="btn-portal" href="#" target="_blank" class="block text-center w-full py-3 bg-slate-200 text-slate-400 font-semibold rounded-xl text-sm pointer-events-none transition duration-200">
      Buka Formulir Presensi
    </a>

    <button onclick="checkLocation()" class="w-full text-center text-xs text-blue-600 font-medium py-1">
      🔄 Perbarui Koordinat GPS
    </button>
  </div>

  <script>
    // 1. Konfigurasi Titik Target (SMP Negeri 6 Singaraja)
    const TARGET_LAT = -8.1228095;  // Sesuaikan titik pasti gerbang sekolah
    const TARGET_LNG = 115.0914546;
    const MAX_RADIUS_METER = 120; 
    const GOOGLE_FORM_URL = "https://forms.gle/Y9o6KnZeUvzMGuQU6";

    // 2. Rumus Haversine untuk kalkulasi jarak (meter)
    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = (x) => (x * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // 3. Validasi Waktu Sesi (WITA)
    function isWithinTimeWindow() {
      const now = new Date();
      // Konversi ke jam lokal WITA (UTC+8)
      const witaHours = (now.getUTCHours() + 8) % 24;
      const witaMinutes = now.getUTCMinutes();
      const currentTime = witaHours * 60 + witaMinutes;

      // Rentang Sesi (dalam menit):
      // Sesi Pagi: 06:45 (405) - 08:00 (480)
      // Sesi Siang: 12:30 (750) - 14:00 (840)
      const morningValid = (currentTime >= 405 && currentTime <= 480);
      const noonValid = (currentTime >= 750 && currentTime <= 840);

      return (morningValid || noonValid);
    }

    // 4. Deteksi Lokasi
    function checkLocation() {
      const card = document.getElementById('status-card');
      const title = document.getElementById('status-title');
      const desc = document.getElementById('status-desc');
      const distText = document.getElementById('distance-text');
      const btn = document.getElementById('btn-portal');

      if (!navigator.geolocation) {
        title.innerText = "GPS Tidak Didukung";
        desc.innerText = "Gunakan peramban modern seperti Google Chrome di smartphone.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const distance = Math.round(getDistanceInMeters(userLat, userLng, TARGET_LAT, TARGET_LNG));
          
          distText.innerText = `${distance} Meter (Maks. ${MAX_RADIUS_METER}m)`;

          const timeValid = isWithinTimeWindow();
          const locationValid = distance <= MAX_RADIUS_METER;

          if (locationValid && timeValid) {
            // Lolos Validasi
            card.className = "p-4 rounded-2xl bg-emerald-50 border border-emerald-200 space-y-2";
            title.className = "text-xs font-bold text-emerald-900";
            title.innerText = "Lokasi & Waktu Terverifikasi";
            desc.className = "text-[11px] text-emerald-700 leading-relaxed";
            desc.innerText = "Anda berada di dalam zona SMPN 6 Singaraja pada sesi presensi aktif.";
            
            btn.href = GOOGLE_FORM_URL;
            btn.className = "block text-center w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md transition";
            btn.innerText = "Buka Formulir Presensi";
          } else if (!locationValid) {
            // Di luar jangkauan lokasi
            card.className = "p-4 rounded-2xl bg-red-50 border border-red-200 space-y-2";
            title.className = "text-xs font-bold text-red-900";
            title.innerText = "Presensi Terkunci (Di Luar Jangkauan)";
            desc.className = "text-[11px] text-red-700 leading-relaxed";
            desc.innerText = `Posisi Anda terdeteksi ${distance} meter dari sekolah. Harap mendekat ke area SMPN 6 Singaraja.`;
            
            btn.className = "block text-center w-full py-3 bg-slate-200 text-slate-400 font-semibold rounded-xl text-sm pointer-events-none";
            btn.innerText = "Di Luar Jangkauan";
          } else if (!timeValid) {
            // Di luar jadwal jam sesi
            card.className = "p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-2";
            title.className = "text-xs font-bold text-amber-900";
            title.innerText = "Sesi Presensi Belum Dibuka / Selesai";
            desc.className = "text-[11px] text-amber-700 leading-relaxed";
            desc.innerText = "Presensi hanya dapat diakses pada jam sesi Pagi (06:45 - 08:00) atau Siang (12:30 - 14:00 WITA).";
            
            btn.className = "block text-center w-full py-3 bg-slate-200 text-slate-400 font-semibold rounded-xl text-sm pointer-events-none";
            btn.innerText = "Waktu Sesi Berakhir";
          }
        },
        (error) => {
          title.innerText = "Izin Lokasi Ditolak";
          desc.innerText = "Silakan aktifkan GPS dan izinkan browser mengakses lokasi perangkat.";
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // Jalankan pengecekan saat web dimuat
    window.addEventListener('DOMContentLoaded', () => {
      checkLocation();
      // Update jam digital
      setInterval(() => {
        const d = new Date();
        document.getElementById('live-clock').innerText = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WITA";
      }, 1000);
    });
  </script>
</body>
</html>
